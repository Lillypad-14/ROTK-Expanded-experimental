# Default-enabled patches for the hack build (`make hack`).
# One patch name per line (= a hacks/patches/<name>/ dir); '#' comments.
# Add to this selection without editing the file:  make hack HACKS="@cfg foo"  (@cfg = this file).
# A from-scratch HACKS="..." must still list the required patches below, or the build errors.
# Disable an optional patch by commenting its line.

# The following patches are REQUIRED by every build (the modcode is always linked).
# Excluding one errors the build on purpose. See hack.c for more information.
mod_save
mod_ram # required for every mutable global
mod_scenes # required for mod_save
mod_startup # required for mod_save

# Strongly recommended, otherwise migration from SavSlotPages makes no sense
save_slot_pages

# Strongly recommended, enabling it after migration loses ranger hollow data
ranger_hollow_pages

menu_text
fast_fade
fast_waitstates # ROM WS0 2/1 timing for less lag. Disable for real carts that misread at 2 cycles.
fast_obj_tiles # Faster native OBJ tile search in its existing IWRAM buffer.
fast_oam # Submit sprite pieces without the native stack frame.
# fast_sprite # Experimental frame composer. See docs/performance.md.
mod_options
loot_qol
chapter_select
text_overrides
item_descriptions
unlock_all
skill_expansion
ringwraith
debug_cheats # needs skill_expansion for its player tick and damage hooks
twists # needs skill_expansion for its player tick, damage and combat event hooks
gauntlet # roguelike mode on the main menu GCN Link row (needs skill_expansion, text_overrides)
versus # co-op player-vs-player settings (Friendly Fire)
experimental # off-by-default performance page (audio mixer toggles, camera ease, frame pacing, fast RAM, effect cap)

# Examples and demos:
# demo_pages # demo: two dummy mod-options pages, validating multi-patch + multi-page settings
# demo_table_patch # demo: a data-table patch overwriting one accessory prefix
